<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050508">
<meta name="description" content="Memory Game">
<title>ECHO — Neon Memory</title>
<style>
:root{color-scheme:dark;--bg:#050508;--text:#f4f5ff;--muted:#77798e;--cyan:#40f5ee;--line:#222331}*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 48%,#111225 0%,#080910 37%,#050508 68%);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}button:disabled{cursor:default}button:focus-visible{outline:2px solid white;outline-offset:5px}.sound{position:absolute;top:24px;right:24px;z-index:2;width:39px;height:39px;justify-content:center;display:flex;align-items:center;gap:9px;padding:10px 13px;background:#0f1018;border:1px solid #2b2e40;border-radius:9px;font:600 9px Arial;letter-spacing:1.5px;color:#a6b0bc;transition:.2s}.sound svg{width:15px;height:15px}.sound[aria-pressed=true]{color:var(--cyan);border-color:#40f5ee33;background:#40f5ee08}.sound:hover{border-color:var(--cyan)}main{min-height:100svh;display:grid;place-items:center;padding:32px 22px}.game{width:min(100%,416px);text-align:center}.metrics{display:flex;justify-content:center;align-items:center;gap:0;margin:0 5px 24px}.metric{flex:1}.metric+.metric{border-left:1px solid #242534}.metric-label{font-size:8px;letter-spacing:2px;color:#686b81;font-weight:700}.metric-value{font-family:'Courier New',monospace;font-size:28px;line-height:1.1;letter-spacing:-1px;margin-top:8px}.metric-value.accent{color:var(--cyan);text-shadow:0 0 20px #40f5ee55}.status{display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px;margin-bottom:15px;font-size:9px;font-weight:700;letter-spacing:2px;color:#85899f}.status i{width:5px;height:5px;border-radius:50%;background:currentColor}.status[data-state=watch]{color:#ad9aff}.status[data-state=watch] i{box-shadow:0 0 10px currentColor;animation:breathe .9s infinite}.status[data-state=input],.status[data-state=between]{color:var(--cyan)}.status[data-state=over]{color:#ff7199}.board-shell{position:relative;border:1px solid #27283a;border-radius:23px;background:linear-gradient(145deg,#141520,#0c0d15);padding:17px;box-shadow:0 18px 80px #0009,0 0 80px #6358ff08}.board-shell::before,.board-shell::after{content:'';position:absolute;width:28px;height:2px;background:var(--cyan);box-shadow:0 0 10px #40f5ee88;left:calc(50% - 14px);top:-1px;border-radius:3px}.board-shell::after{top:auto;bottom:-1px;background:#a48aff;box-shadow:0 0 10px #a48aff88}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.pad{aspect-ratio:1;min-width:0;border:1px solid color-mix(in srgb,var(--neon) 50%,#151521);border-radius:14px;position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--neon) 10%,#101019),#101019);color:var(--neon);box-shadow:inset 0 0 19px color-mix(in srgb,var(--neon) 5%,transparent),0 0 12px color-mix(in srgb,var(--neon) 5%,transparent);transition:background .09s,box-shadow .09s,transform .09s;touch-action:manipulation}.pad .symbol{font:33px Arial;line-height:1;text-shadow:0 0 15px color-mix(in srgb,var(--neon) 55%,transparent);opacity:.8;pointer-events:none}.pad .number{position:absolute;bottom:9px;left:11px;font:8px 'Courier New',monospace;color:var(--neon);opacity:.35;pointer-events:none}.pad:not(:disabled):hover{border-color:var(--neon);box-shadow:inset 0 0 20px color-mix(in srgb,var(--neon) 16%,transparent),0 0 15px color-mix(in srgb,var(--neon) 15%,transparent)}.pad.active{background:var(--neon);border-color:#fff9;box-shadow:0 0 26px color-mix(in srgb,var(--neon) 55%,transparent),0 0 65px color-mix(in srgb,var(--neon) 22%,transparent),inset 0 0 16px #ffffff66;transform:scale(.96);z-index:1}.pad.active .symbol{color:#06060c;text-shadow:none;opacity:.9}.pad.active .number{color:#06060c;opacity:.6}.pad.wrong{background:#ff4265;border-color:#ffacc0;box-shadow:0 0 35px #ff426566}.pad.wrong .symbol{color:#fff}.progress{display:flex;gap:4px;justify-content:center;align-items:center;min-height:7px;margin:17px 0 23px;flex-wrap:wrap}.progress i{width:4px;height:4px;border-radius:50%;background:#323448}.progress i.done{background:var(--cyan);box-shadow:0 0 6px #40f5ee77}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#0d0e16;border:1px solid #252635;border-radius:10px;padding:4px;margin:0 0 12px}.mode{padding:10px 8px;border:1px solid transparent;border-radius:6px;background:transparent;font:600 9px Arial;letter-spacing:1.6px;color:#7c7e93;transition:.15s}.mode[aria-pressed=true]{color:#e4d9ff;background:#a384ff19;border-color:#a384ff40;box-shadow:0 0 12px #a384ff08}.mode:disabled{opacity:.45}.mode[aria-pressed=true]:disabled{opacity:.8}.start{width:100%;padding:17px 20px;min-height:51px;border:1px solid #64fff4;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:13px;background:var(--cyan);color:#041716;font-size:11px;font-weight:800;letter-spacing:2.4px;box-shadow:0 0 25px #40f5ee25;transition:box-shadow .2s,transform .2s}.start svg{width:14px;height:14px}.start:hover{box-shadow:0 0 35px #40f5ee55;transform:translateY(-1px)}.start:active{transform:translateY(1px)}.result{font-size:10px;line-height:1.7;letter-spacing:.3px;color:#9c9fb6;margin:13px 0 0;min-height:17px}body{position:relative}.win-badge{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;opacity:0;transition:opacity .15s}.win-badge span{display:block;background:#0a1029e8;backdrop-filter:blur(12px);color:#8effe5;border:1px solid #68ffe988;border-radius:11px;padding:13px 19px;font:800 11px Arial;letter-spacing:2px;box-shadow:0 0 35px #40f5ee22}.win-badge.show{opacity:1}.board-shell.success{animation:win-ring .7s ease-out}.board-shell.error{animation:shake .25s}#sound-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}#fireworks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}@keyframes breathe{50%{opacity:.3}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes win-ring{30%{box-shadow:0 0 0 5px #40f5ee16,0 0 60px #40f5ee22}100%{box-shadow:0 0 0 15px transparent}}@media(max-width:550px){main{min-height:100svh;display:grid;place-items:center;padding:32px 22px}.game{max-width:365px}.board-shell{padding:14px;border-radius:20px}.board{gap:10px}.pad{border-radius:12px}.pad .symbol{font-size:29px}.metrics{margin-bottom:20px}.metric-value{font-size:25px}.metric-label{font-size:7px;letter-spacing:1.6px}.status{font-size:8px;margin-bottom:13px}.progress{margin:15px 0 19px}.mode{padding:9px 5px}.sound{font-size:8px;padding:9px 10px}}@media(max-height:1050px) and (min-width:551px){main{min-height:100svh;display:grid;place-items:center;padding:32px 22px}.game{width:355px}.metrics{margin-bottom:18px}.metric-value{font-size:25px}.board-shell{padding:14px}.board{gap:10px}.progress{margin:13px 0 17px}.start{padding:15px}.result{margin-top:10px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.pad.active{transform:none}}
</style>
</head>
<body>
<button class="sound" id="sound" aria-label="Mute sound" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5z"/><path id="sound-wave" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><span id="sound-label">SOUND ON</span></button>
<main><section class="game" aria-label="Memory game"><div class="metrics"><div class="metric"><div class="metric-label">LEVEL</div><div class="metric-value accent" id="level">01</div></div><div class="metric"><div class="metric-label">SCORE</div><div class="metric-value" id="score">00</div></div><div class="metric"><div class="metric-label">BEST CLEARED</div><div class="metric-value" id="best">00</div></div></div><div class="status" id="status" data-state="idle" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="status-text">READY</span></div><div class="board-shell" id="console"><div class="board" id="board" role="group" aria-label="Memory pads, numbered 1 through 9"></div><div class="win-badge" id="win-badge" aria-hidden="true"><span>LEVEL CLEARED ✦</span></div></div><div class="progress" id="progress" aria-hidden="true"></div><div class="modes" role="group" aria-label="Game speed"><button class="mode" data-mode="calm" aria-pressed="false">CHILL</button><button class="mode" data-mode="normal" aria-pressed="true">FLOW</button><button class="mode" data-mode="fast" aria-pressed="false">TURBO ⚡</button></div><button class="start" id="start"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 3 11 7-11 7Z" fill="currentColor"/></svg><span id="start-label">LET'S PLAY</span></button><p class="result" id="result" aria-live="polite"></p></section></main>
<canvas id="fireworks" aria-hidden="true"></canvas>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const modes={calm:{on:650,gap:270},normal:{on:420,gap:210},fast:{on:240,gap:150}};
const colors=['#43f5ef','#b38bff','#ff67b9','#baff60','#4e99ff','#ffb649','#ff656b','#62ffbd','#df77ff'];
const marks=['✳','✦','◒','◈','✚','◕','✶','◇','⌁'];
let mode='normal',phase='idle',sequence=[],position=0,completed=0,run=0,soundOn=true,audioCtx=null,storageOK=true,bests={calm:0,normal:0,fast:0};
const pulseIds=Array(9).fill(0);
try{const saved=JSON.parse(localStorage.getItem('echo-memory-v1')||'{}');for(const k of Object.keys(bests)){if(Number.isSafeInteger(saved[k])&&saved[k]>=0)bests[k]=saved[k]}}catch{storageOK=false}
const pads=colors.map((color,i)=>{const b=document.createElement('button');b.className='pad';b.style.setProperty('--neon',color);b.innerHTML=`<span class="symbol" aria-hidden="true">${marks[i]}</span><span class="number" aria-hidden="true">0${i+1}</span>`;b.setAttribute('aria-label',`Pad ${i+1}`);b.disabled=true;b.addEventListener('click',()=>input(i));$('board').append(b);return b});
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function audioReady(){if(!soundOn)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}catch{soundOn=false;renderSound()}}
function tone(i,error=false,delay=0){if(!soundOn||!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime+delay;o.type='sine';o.frequency.value=error?130:[261.63,293.66,329.63,349.23,392,440,493.88,523.25,587.33][i];g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.055,now+.012);g.gain.exponentialRampToValueAtTime(.001,now+.18);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.2)}catch{}}
function renderSound(){$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').setAttribute('aria-label',soundOn?'Mute sound':'Enable sound');$('sound-label').textContent=soundOn?'SOUND ON':'SOUND OFF';$('sound-wave').setAttribute('d',soundOn?'M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14':'m16 9 6 6m0-6-6 6')}
// Browsers allow audio after the first user gesture, with no extra sound toggle.
function unlockAudio(){audioReady()}
document.addEventListener('pointerdown',unlockAudio,{once:true});document.addEventListener('keydown',unlockAudio,{once:true});
function status(text,state=phase){$('status-text').textContent=text;$('status').dataset.state=state}
function setPhase(value){phase=value;pads.forEach(b=>b.disabled=value!=='input');document.querySelectorAll('.mode').forEach(b=>b.disabled=!['idle','over'].includes(value))}
function clearPads(){pads.forEach((p,i)=>{pulseIds[i]++;p.classList.remove('active','wrong')})}
function stats(){$('level').textContent=String(Math.max(1,sequence.length)).padStart(2,'0');$('score').textContent=String(completed*10).padStart(2,'0');$('best').textContent=String(bests[mode]).padStart(2,'0')}
function progress(){const frag=document.createDocumentFragment();for(let i=0;i<Math.min(sequence.length,32);i++){const dot=document.createElement('i');if(i<position)dot.className='done';frag.append(dot)}$('progress').replaceChildren(frag)}
function saveBest(){if(completed>bests[mode]){bests[mode]=completed;try{localStorage.setItem('echo-memory-v1',JSON.stringify(bests))}catch{storageOK=false}}}
async function flash(i,duration,id){const pulse=++pulseIds[i];pads[i].classList.add('active');tone(i);await wait(duration);if(id!==run)return false;if(pulse===pulseIds[i])pads[i].classList.remove('active');return true}
const canvas=$('fireworks'),ctx=canvas.getContext('2d');let particles=[],animation=0,startTime=0,lastTime=0;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
function stopFireworks(){cancelAnimationFrame(animation);animation=0;particles=[];if(ctx)ctx.clearRect(0,0,canvas.width,canvas.height)}
function fireworks(){stopFireworks();if(!ctx||reduced.matches)return;const dpr=Math.min(window.devicePixelRatio||1,2),w=window.innerWidth,h=window.innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const b=$('console').getBoundingClientRect();const origins=[{x:b.left+b.width*.12,y:b.top+b.height*.2},{x:b.right-b.width*.12,y:b.top+b.height*.16},{x:b.left+b.width*.5,y:b.top+b.height*.02}];origins.forEach((origin,j)=>{for(let i=0;i<24;i++){const angle=Math.PI*2*i/24,speed=45+Math.random()*100;particles.push({x:origin.x,y:origin.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-25,color:colors[(i+j*2)%colors.length],life:0,delay:j*.1,max:.65+Math.random()*.3,size:1+Math.random()*1.5})}});startTime=lastTime=performance.now();function frame(now){const dt=Math.min((now-lastTime)/1000,.04),elapsed=(now-startTime)/1000;lastTime=now;ctx.clearRect(0,0,w,h);for(const p of particles){if(elapsed<p.delay)continue;p.life+=dt;if(p.life>p.max)continue;p.vy+=100*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=Math.max(0,1-p.life/p.max);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;if(elapsed<1.2)animation=requestAnimationFrame(frame);else stopFireworks()}animation=requestAnimationFrame(frame)}
async function nextRound(id){if(id!==run)return;setPhase('watch');position=0;sequence.push(Math.floor(Math.random()*9));stats();progress();status('WATCH THE PATTERN');await wait(650);if(id!==run)return;for(const i of sequence){if(!await flash(i,modes[mode].on,id))return;await wait(modes[mode].gap);if(id!==run)return}setPhase('input');status('YOUR TURN');}
async function input(i){if(phase!=='input')return;const id=run;audioReady();if(sequence[position]!==i){clearPads();pads[i].classList.add('wrong');tone(i,true);setPhase('over');saveBest();stats();status('GAME OVER','over');$('console').classList.add('error');$('start-label').textContent='TRY AGAIN';$('result').textContent=`${completed} ${completed===1?'level':'levels'} cleared · ${completed*10} points${completed>0&&completed===bests[mode]?' · Personal best!':''}`;await wait(350);if(id===run){clearPads();$('console').classList.remove('error')}return}
position++;progress();flash(i,150,id);if(position===sequence.length){completed++;saveBest();stats();setPhase('between');status('LEVEL CLEARED!','between');$('console').classList.add('success');$('win-badge').classList.add('show');fireworks();tone(4);tone(6);tone(8);await wait(1250);if(id!==run)return;$('console').classList.remove('success');$('win-badge').classList.remove('show');nextRound(id)}else status(`YOUR TURN · ${position} / ${sequence.length}`)}
function resetVisuals(){clearPads();stopFireworks();$('console').classList.remove('success','error');$('win-badge').classList.remove('show')}
function start(){run++;resetVisuals();sequence=[];position=0;completed=0;$('result').textContent='';$('start-label').textContent='RESTART';audioReady();nextRound(run)}
$('start').addEventListener('click',start);
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{if(!['idle','over'].includes(phase))return;mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(m=>m.setAttribute('aria-pressed',String(m===b)));run++;resetVisuals();sequence=[];completed=0;position=0;setPhase('idle');stats();progress();status('READY');$('result').textContent='';$('start-label').textContent="LET'S PLAY"}));
$('sound').addEventListener('click',()=>{soundOn=!soundOn;if(soundOn){audioReady();tone(4)}else if(audioCtx)audioCtx.suspend().catch(()=>{});renderSound()});
function stopForPause(){if(['idle','over'].includes(phase))return;run++;resetVisuals();saveBest();setPhase('over');status('RUN PAUSED · START FRESH','over');$('start-label').textContent='PLAY AGAIN';$('result').textContent=`${completed} ${completed===1?'level':'levels'} cleared · ${completed*10} points${storageOK?' · Best saved.':' · Storage unavailable.'}`}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopForPause();if(audioCtx)audioCtx.suspend().catch(()=>{})}});window.addEventListener('resize',stopFireworks);
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(/^[1-9]$/.test(e.key)){e.preventDefault();input(Number(e.key)-1)}else if(e.code==='Space'&&!['BUTTON','INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();start()}});
stats();if(!storageOK)$('result').textContent='Storage unavailable. You can still play.';
})();
</script>
</body>
</html>
